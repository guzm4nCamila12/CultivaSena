services:
  app:
    build:
      context: .
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_API_URL_CULTIVA: ${REACT_APP_API_URL_CULTIVA}
    container_name: cultivasena_sensores_front
    env_file:
      - .env
    ports:
      - "0.0.0.0:9001:80"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cultivasena_network

networks:
  cultivasena_network:
    driver: bridge